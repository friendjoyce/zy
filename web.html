<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>ZY · 文档问答</title><style>body{max-width:850px;margin:60px auto;padding:20px;font:17px system-ui;background:#f5f7fb;color:#172238}textarea{width:100%;box-sizing:border-box;padding:15px}button{padding:12px 28px;background:#234fbd;color:white;border:0;border-radius:8px;margin:16px}pre{white-space:pre-wrap;background:white;padding:24px;border-radius:12px}summary{cursor:pointer}footer{color:#667;font-size:14px}</style><h1>ZY 文档问答</h1><p>检索知识库，查看回答依据。默认仅摘录原文。</p><form id="form"><textarea id="question" required maxlength="2000" rows="4" placeholder="例如：RAG 是什么？"></textarea><label><input id="generate" type="checkbox">使用本地模型生成（需要配置 Ollama）</label><button id="submit">提问</button></form><p id="status" role="status"></p><pre id="answer"></pre><section id="sources"></section><footer>引用编号检查不代表事实核验。模型可能出错，请核对原文。</footer><script>
form.onsubmit=async e=>{e.preventDefault();document.getElementById("submit").disabled=true;document.getElementById('status').textContent='正在检索…';document.getElementById('sources').replaceChildren();try{let r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:question.value,generate:generate.checked})});let d=await r.json();if(!r.ok)throw Error(d.error);document.getElementById('answer').textContent=d.answer;document.getElementById('status').textContent=d.mode+' · '+d.latency_ms+' ms · 未知引用：'+d.citation_check.unknown_ids.join(',');for(let s of d.sources){let detail=document.createElement('details'),title=document.createElement('summary'),text=document.createElement('pre');title.textContent=`[${s.id}] ${s.source} · 段落 ${s.paragraph} · ${s.score.toFixed(3)}`;text.textContent=s.text;detail.append(title,text);sources.append(detail)}}catch(e){document.getElementById('status').textContent=e.message}finally{document.getElementById("submit").disabled=false}};
</script></html>
